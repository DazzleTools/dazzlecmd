[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dazzle-dz"
version = "0.11.6"
description = "Alias for dazzlecmd -- unified CLI for the DazzleTools collection"
readme = {text = "This is an alias package. Run `pip install dazzlecmd` or `pip install dazzle-dz` -- both install the same tool. See https://github.com/DazzleTools/dazzlecmd for documentation.", content-type = "text/plain"}
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
authors = [
    {name = "Dustin", email = "6962246+djdarcy@users.noreply.github.com"},
]
keywords = ["cli", "tools", "utility", "dazzletools", "dazzle", "command-line", "aggregator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = ["dazzlecmd>=0.11.6", "dazzlecmd-lib>=0.9.10"]

# Declare the same console scripts as dazzlecmd (pointing at its entry point,
# importable because dazzlecmd is a dependency). Without this, isolated
# installers expose nothing from `pipx install dazzle-dz` -- they only surface
# the NAMED package's apps, not its dependencies', so `dz`/`dazzlecmd` (which
# live in the dazzlecmd dep) would require `--include-deps`.
[project.scripts]
dz = "dazzlecmd.cli:main"
dazzlecmd = "dazzlecmd.cli:main"

[project.urls]
Homepage = "https://github.com/DazzleTools/dazzlecmd"
Repository = "https://github.com/DazzleTools/dazzlecmd"
Issues = "https://github.com/DazzleTools/dazzlecmd/issues"

[tool.setuptools.packages.find]
where = ["src"]
