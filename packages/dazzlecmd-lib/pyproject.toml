[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dazzlecmd-lib"
version = "0.8.3"
description = "Engine library for dazzlecmd-pattern tool aggregators"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
authors = [
    {name = "Dustin", email = "6962246+djdarcy@users.noreply.github.com"},
]
keywords = ["cli", "tools", "aggregator", "engine", "dispatch", "dazzletools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # The DazzleEntity object model (entity.py / aggregator_config.py) is built
    # on Pydantic v2 -- a hard runtime dependency since the 0.8.x rearchitecture.
    # (colorama and distro are imported best-effort under try/except, so they
    # stay optional/undeclared; pydantic is the one unconditional import.)
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Windows ANSI translation for legacy cmd.exe (modern Windows 1511+
# handles ANSI natively via VT processing; only legacy cmd needs this).
# v0.6.0: introduced for the color taxonomy module (#49).
color = ["colorama>=0.4.0; platform_system == 'Windows'"]

[project.urls]
Homepage = "https://github.com/DazzleTools/dazzlecmd"
Repository = "https://github.com/DazzleTools/dazzlecmd"
Issues = "https://github.com/DazzleTools/dazzlecmd/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dazzlecmd_lib = [
    "templates/*",
    "templates/**/*",
    "templates/**/**/*",
]
